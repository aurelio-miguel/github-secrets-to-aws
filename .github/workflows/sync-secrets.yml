name: Sync secrets to AWS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-secrets-${{ vars.AWS_SECRET_ARN }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_SECRET_ARN: ${{ vars.AWS_SECRET_ARN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate AWS configuration
        run: |
          python - <<'PY'
          import os
          import sys
          required = ("AWS_REGION", "AWS_ROLE_ARN", "AWS_SECRET_ARN")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              print("Missing GitHub Actions variables: " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-secrets-sync-${{ github.run_id }}

      - name: Synchronize selected secrets
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
          DEMO_DB_PASSWORD: ${{ secrets.DEMO_DB_PASSWORD }}
        run: python scripts/sync-secrets.py
